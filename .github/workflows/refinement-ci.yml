name: Mechanized Refinement Verification (Coq 8.18.0 <-> Rust)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 1' # Weekly toolchain drift detection

permissions:
  contents: read

jobs:
  verify-refinement:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Refinement Harness
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Cryptographic Provenance & Immutability Audit
        run: |
          chmod +x scripts/*.sh extract/*.sh || true
          bash scripts/verify_provenance.sh PINS.lock

      - name: Prepare Container Permissions for Build Artifacts
        run: |
          # Grant full write permissions to the workspace so container user 'coq' (UID 1000)
          # can generate .vo and .glob artifacts next to .v source files
          chmod -R 777 .

      - name: Setup Coq 8.18.0 & Verify Refinement
        uses: coq-community/docker-coq-action@v1
        with:
          coq_version: '8.18.0'
          custom_script: |
            bash scripts/verify_coq.sh
